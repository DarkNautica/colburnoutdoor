<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Colburn Outdoor">
  <rect width="64" height="64" rx="15" fill="#071612" />
  <!-- Water droplet: the one shape that still reads at 16px. -->
  <path
    d="M32 9.5c8.9 10.9 14.2 18.4 14.2 24.6a14.2 14.2 0 0 1-28.4 0C17.8 27.9 23.1 20.4 32 9.5Z"
    fill="#b9ff4b"
  />
  <!-- Highlight, so the droplet still has form on a light browser chrome. -->
  <path
    d="M26.4 31.8c0-3 1.5-6.2 4.3-10.1"
    fill="none"
    stroke="#071612"
    stroke-width="3"
